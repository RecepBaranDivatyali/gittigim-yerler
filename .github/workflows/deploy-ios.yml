name: Build and Deploy iOS to App Store Connect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/deploy-ios.yml'

jobs:
  build-and-deploy:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Set App Version and Build Number
        run: |
          BUILD_NUM=${{ github.run_number }}
          echo "Setting CFBundleVersion to $BUILD_NUM and CFBundleShortVersionString to 3.0"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 3.0" ios/App/App/Info.plist || true

      - name: Install Apple Distribution Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          node -e '
          const https = require("https");
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");
          const os = require("os");

          const keyId = process.env.APP_STORE_CONNECT_KEY_ID;
          const issuerId = process.env.APP_STORE_CONNECT_ISSUER_ID;
          const keyBase64 = process.env.APP_STORE_CONNECT_API_KEY_BASE64;

          if (!keyId || !issuerId || !keyBase64) {
            console.error("App Store Connect credentials missing");
            process.exit(1);
          }

          const privateKey = Buffer.from(keyBase64, "base64").toString("utf8");
          const now = Math.floor(Date.now() / 1000);
          const header = Buffer.from(JSON.stringify({ alg: "ES256", kid: keyId, typ: "JWT" })).toString("base64url");
          const payload = Buffer.from(JSON.stringify({ iss: issuerId, iat: now, exp: now + 1200, aud: "appstoreconnect-v1" })).toString("base64url");
          const data = header + "." + payload;
          const sig = crypto.sign("sha256", Buffer.from(data), { key: privateKey, dsaEncoding: "ieee-p1363" }).toString("base64url");
          const token = data + "." + sig;

          const req = https.request("https://api.appstoreconnect.apple.com/v1/profiles?limit=50", {
            headers: {
              "Authorization": "Bearer " + token,
              "User-Agent": "Gezgin-Deploy"
            }
          }, (res) => {
            let body = "";
            res.on("data", chunk => body += chunk);
            res.on("end", () => {
              if (res.statusCode !== 200) {
                console.error("App Store Connect API error:", res.statusCode, body);
                process.exit(1);
              }
              const json = JSON.parse(body);
              const profile = (json.data || []).find(p => p.attributes && p.attributes.name === "Gezgin AppStore Profile") || (json.data || [])[0];
              if (!profile) {
                console.error("No profile found in App Store Connect!");
                process.exit(1);
              }
              const uuid = profile.attributes.uuid;
              const profileContent = profile.attributes.profileContent;
              console.log("Found profile:", profile.attributes.name, "UUID:", uuid);

              const profilesDir = path.join(os.homedir(), "Library/MobileDevice/Provisioning Profiles");
              fs.mkdirSync(profilesDir, { recursive: true });

              const targetFile = path.join(profilesDir, uuid + ".mobileprovision");
              const namedFile = path.join(profilesDir, "Gezgin_AppStore_Profile.mobileprovision");
              const buf = Buffer.from(profileContent, "base64");
              fs.writeFileSync(targetFile, buf);
              fs.writeFileSync(namedFile, buf);
              console.log("Saved profile to", targetFile);

              if (process.env.GITHUB_ENV) {
                fs.appendFileSync(process.env.GITHUB_ENV, "PROFILE_UUID=" + uuid + "\n");
              }
            });
          });
          req.on("error", (err) => {
            console.error("Request error:", err);
            process.exit(1);
          });
          req.end();
          '

      - name: Create ExportOptions.plist
        run: |
          cat << 'EOF' > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>FTU8J2LG99</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.gittigimyerler.app</key>
              <string>Gezgin AppStore Profile</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build Archive
        run: |
          BUILD_NUM=${{ github.run_number }}
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Gezgin AppStore Profile" \
            DEVELOPMENT_TEAM="FTU8J2LG99" \
            PROVISIONING_PROFILE="${{ env.PROFILE_UUID }}" \
            CURRENT_PROJECT_VERSION=$BUILD_NUM \
            MARKETING_VERSION="3.0"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gezgin-iOS-IPA
          path: build/*.ipa

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          IPA_PATH=$(find build -name "*.ipa" | head -n 1)
          echo "Found IPA at: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
